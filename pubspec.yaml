name: pma_flutter
description: Couples Medical Appointment & Medication Manager - Flutter Frontend
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.1.0

  # Navigation
  go_router: ^14.0.0

  # HTTP & API
  dio: ^5.3.0

  # Secure Storage (for auth tokens)
  flutter_secure_storage: ^9.0.0

  # Local Database (offline-first with Hive)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Date & Time Formatting
  intl: ^0.19.0

  # Typography & Fonts
  google_fonts: ^7.0.0

  # Icons (matching mockup design)
  phosphor_flutter: ^2.1.0

  # Calendar & Scheduling
  table_calendar: ^3.1.0

  # Local Notifications & Reminders
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2

  # UI & Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

  # Code generation for Hive models & Riverpod generators
  build_runner: ^2.4.0
  hive_generator: ^2.0.0
  riverpod_generator: ^2.3.0

flutter:
  uses-material-design: true

  # Assets (icons, images, etc.)
  assets:
    - assets/images/
    - assets/icons/

  # Fonts (optional) - commented out, will add later
  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700