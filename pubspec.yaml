name: ltmo
description: Couples Medical Appointment & Medication Manager - Flutter Frontend
publish_to: 'none'

version: 0.1.11+11

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.1.0

  # Navigation
  go_router: ^14.0.0

  # HTTP & API
  dio: ^5.3.0

  # Google Sign-In
  google_sign_in: ^6.2.1

  # Secure Storage (for auth tokens)
  flutter_secure_storage: ^10.3.1

  # Local Database (offline-first with Hive)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Date & Time Formatting
  intl: ^0.20.2

  # Typography & Fonts
  google_fonts: ^7.0.0

  # Icons (matching mockup design)
  phosphor_flutter: ^2.1.0

  # Calendar & Scheduling
  table_calendar: ^3.1.0

  # Local Notifications & Reminders
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.1

  # Push Notifications (server-driven, survives OEM battery management -
  # e.g. Samsung killing app-scheduled local alarms)
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.6

  # Requests exemption from OEM battery optimization (Samsung/Xiaomi/etc.
  # kill scheduled local-notification alarms otherwise) and the Android 13+
  # notification permission.
  permission_handler: ^11.3.1

  # UI & Icons
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.3.0

  # App version display (splash screen, settings)
  package_info_plus: ^10.2.1

  # Network connectivity detection (offline mode banner + write queue)
  connectivity_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

  # Code generation for Hive models & Riverpod generators
  build_runner: ^2.4.0
  hive_generator: ^2.0.0
  riverpod_generator: ^2.3.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # Assets (icons, images, etc.)
  assets:
    - assets/images/
    - assets/icons/

  # Fonts (optional) - commented out, will add later
  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700