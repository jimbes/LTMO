name: Build Android Releases

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.3'
          channel: stable

      # Firebase Android client config - gitignored, injected from a secret
      # rather than committed (see the .gitignore comment on that path).
      - name: Restore google-services.json
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > android/app/google-services.json

      # Release signing keystore + key.properties - same reasoning, never
      # committed. build.gradle.kts silently falls back to debug signing
      # when key.properties is absent, so these secrets must all be set
      # together or the "release" APK will actually be debug-signed.
      - name: Restore release keystore
        run: |
          mkdir -p android/keys
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/keys/ltmo-release.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=keys/ltmo-release.jks
          EOF

      # Fails fast with a clear keytool error if ANDROID_KEYSTORE_BASE64 was
      # pasted incorrectly (truncated/corrupted), instead of discovering it
      # 2 minutes into the release build via a cryptic Gradle DER-parsing
      # error. The checksum is not sensitive - compare it against
      # `sha256sum android/keys/ltmo-release.jks` on your own machine to
      # confirm the secret matches the real file byte-for-byte.
      - name: Verify keystore
        run: |
          echo "Keystore SHA256: $(sha256sum android/keys/ltmo-release.jks | cut -d' ' -f1)"
          keytool -list -keystore android/keys/ltmo-release.jks \
            -storepass "${{ secrets.ANDROID_STORE_PASSWORD }}" \
            -alias "${{ secrets.ANDROID_KEY_ALIAS }}"

      - run: flutter pub get

      # The GitHub Actions run number is the single source of truth for the
      # version, baked into the APK itself via --build-name/--build-number.
      # This is what package_info_plus reads at runtime (splash screen,
      # settings), so what the app displays always matches the release tag
      # exactly - no manual pubspec.yaml bump required per release.
      #
      # +1 offset: versionCode 10 (0.1.10) was uploaded to the Play Console
      # from a local build made outside CI while iterating on a bug fix,
      # bypassing this counter. Run #10 (the next run after that) would
      # otherwise collide with that already-used versionCode - the Play
      # Console rejects re-using one. Bumping by 1 here makes run #10 emit
      # 11, safely past it, and every run after stays consistent since this
      # is now the only place versions get cut again.
      - name: Compute version
        id: version
        run: |
          number=$(( ${{ github.run_number }} + 1 ))
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "name=0.1.$number" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: flutter build apk --release --build-name=${{ steps.version.outputs.name }} --build-number=${{ steps.version.outputs.number }}

      # App Bundle - the format the Play Store actually requires for
      # submission (the release APK above is kept for sideloading/testing).
      - name: Build release AAB
        run: flutter build appbundle --release --build-name=${{ steps.version.outputs.name }} --build-number=${{ steps.version.outputs.number }}

      - name: Rename artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/ltmo-${{ steps.version.outputs.name }}-release.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/ltmo-${{ steps.version.outputs.name }}-release.aab"

      # Only the release APK is public - it's meant for anyone to sideload.
      # Its signing certificate is the public half by design (installing
      # from anywhere exposes the same one); nothing sensitive leaks by
      # attaching it here. NOTE: it's signed with the upload key, not the
      # Play App Signing certificate the Play Store re-signs with, so a
      # device can't have both this build and the Play Store build installed
      # at once - Android blocks installing/updating across a signature
      # mismatch until the other one is uninstalled first.
      - name: Create release (public release APK only)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: LTMO v${{ steps.version.outputs.name }}
          body: |
            Signed with the upload key, not the Play Store's certificate - don't install this alongside the Play Store version of LTMO (signature mismatch blocks the install/update).
          files: |
            dist/ltmo-${{ steps.version.outputs.name }}-release.apk

      # AAB isn't directly installable - only used to upload to the Play
      # Console - so it stays private: Actions artifacts require repo access
      # + auth to download, unlike public Release assets.
      - name: Upload AAB (private)
        uses: actions/upload-artifact@v4
        with:
          name: ltmo-${{ steps.version.outputs.name }}
          path: dist/ltmo-${{ steps.version.outputs.name }}-release.aab
